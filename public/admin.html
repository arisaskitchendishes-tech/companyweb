<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arisa's Kitchen — Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a1a0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<!-- Login -->
<section class="login" id="login">
  <form class="card login-card" id="loginForm">
    <img src="assets/logo.png" alt="Arisa's Kitchen" width="120" height="120">
    <h1>Kitchen Dashboard</h1>
    <p class="muted" id="loginHint">Sign in to manage orders and bookings.</p>
    <div class="field" id="emailField"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="field"><label for="lPass" id="lPassLbl">Password</label><input id="lPass" type="password" autocomplete="current-password" required><div class="msg" id="lErr">Wrong details</div></div>
    <button class="btn btn-red btn-block">Sign in</button>
    <a href="index.html" class="back">‹ Back to website</a>
  </form>
</section>

<!-- App -->
<div class="dash" id="dash" hidden>
  <aside class="side">
    <div class="side-brand"><img src="assets/logo-sm.png" alt="" width="44" height="44"><span><b>Arisa's</b><small>Kitchen dashboard</small></span></div>
    <nav class="side-nav">
      <button class="on" data-view="orders">🧾 <span>Orders</span><em id="nOrders"></em></button>
      <button data-view="bookings">📅 <span>Bookings</span><em id="nBookings"></em></button>
      <button data-view="menu">🍗 <span>Menu stock</span></button>
    </nav>
    <div class="side-foot">
      <label class="switch-row"><input type="checkbox" id="soundOn" checked><span class="sw"></span>New-order sound</label>
      <button class="btn btn-sm btn-ghost-l" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h2 id="viewTitle">Orders</h2><small class="muted" id="modeTag"></small></div>
      <div class="top-r">
        <span class="live"><i></i>Live</span>
        <button class="btn btn-sm btn-sun" id="seed" hidden>+ Test order</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <section class="view on" data-v="orders">
      <div class="toolbar">
        <div class="chips" id="oFilters"></div>
        <label class="search sm"><span>🔍</span><input id="oSearch" type="search" placeholder="Search name, phone, code"></label>
      </div>
      <div class="board" id="oList"></div>
    </section>

    <section class="view" data-v="bookings">
      <div class="toolbar">
        <div class="chips" id="bFilters"></div>
        <label class="search sm"><span>🔍</span><input id="bSearch" type="search" placeholder="Search name, phone, code"></label>
      </div>
      <div id="bList"></div>
    </section>

    <section class="view" data-v="menu">
      <p class="muted" style="margin-bottom:12px">Switch off anything that has run out. Customers see "Sold out" straight away.</p>
      <div class="stock" id="stock"></div>
    </section>
  </main>

  <nav class="adm-tabs">
    <button class="on" data-view="orders">🧾<span>Orders</span></button>
    <button data-view="bookings">📅<span>Bookings</span></button>
    <button data-view="menu">🍗<span>Stock</span></button>
  </nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
